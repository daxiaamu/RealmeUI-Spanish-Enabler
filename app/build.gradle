plugins {
    id "com.android.application"
}

android {
    namespace "com.daxiaamu.forcelanguage"
    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.daxiaamu.realmeui.spanishenabler"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.2.1"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
