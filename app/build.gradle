plugins {
    id "com.android.application"
}

android {
    namespace "com.daxiaamu.forcelanguage"
    compileSdk 37
    compileSdkMinor 0

    defaultConfig {
        applicationId "com.daxiaamu.realmeui.spanishenabler"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

